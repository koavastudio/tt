<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex,nofollow">

<title>Brew Buddy - TikTok LIVE overlay</title>
<style>
/* Brew Buddy - TikTok LIVE Studio Edition */
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
[hidden] { display: none !important; }

#cm-root { position: absolute; inset: 0; overflow: hidden; --chalk: #fbf6ea; --paper: #fffaf0; --ink: #3a2a2a; --water: #7cc8f2; }
#cm-root.cm-autohide { transition: opacity .7s ease, transform .7s ease; }
#cm-root.cm-autohide.cm-hidden { opacity: 0; pointer-events: none; }
#cm-root.cm-autohide.cm-hide-fade.cm-hidden { transform: translateY(24px); }
#cm-root.cm-autohide.cm-hide-slide { transition-duration: .9s; }
#cm-root.cm-autohide.cm-hide-slide.cm-hidden { transform: translateY(110%); }
#cm-root.cm-autohide.cm-hide-pop.cm-hidden { transform: scale(.6); }
#cm-stage { position: absolute; left: 0; top: 0; width: 1600px; height: 1080px; transform-origin: 0 0; }
#cm-stage img { display: block; max-width: none; user-select: none; -webkit-user-drag: none; }

#cm-sign, #cm-machine-wrap, #cm-cup, #cm-receipt, .cm-stream, .cm-shadow { position: absolute; }
.cm-full { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
.cm-art { position: absolute; inset: 0; isolation: isolate; }
.cm-art > * { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
.cm-tint { mix-blend-mode: color; pointer-events: none; }
.cm-light { pointer-events: none; }

/* ---------- soft CSS shadows (the art has none, so they stay still while the machine shakes) */
.cm-shadow { border-radius: 50%; background: radial-gradient(closest-side, rgba(45, 25, 20, .28), rgba(45, 25, 20, 0)); pointer-events: none; transition: filter .6s ease; }
#cm-root.cm-no-shadows .cm-shadow, #cm-root.cm-no-shadows .cm-cup-shadow { display: none; }

/* ---------- focus (receipt) mode */
#cm-machine-wrap, #cm-sign { transition: filter .6s ease; }
#cm-stage.cm-focus #cm-machine-wrap,
#cm-stage.cm-focus #cm-sign,
#cm-stage.cm-focus .cm-shadow { filter: blur(6px) brightness(.9); }

/* ---------- machine */
#cm-machine { position: absolute; inset: 0; isolation: isolate; }
#cm-machine.cm-shaking { animation: cm-shake .1s linear infinite; }
@keyframes cm-shake {
  0%   { transform: translate(0, 0) rotate(0); }
  25%  { transform: translate(1.8px, -.9px) rotate(.12deg); }
  50%  { transform: translate(-1.4px, 1px) rotate(-.1deg); }
  75%  { transform: translate(1.1px, 1.1px) rotate(.06deg); }
  100% { transform: translate(0, 0) rotate(0); }
}
#cm-tank canvas { position: absolute; }
#cm-tank-shine { background: #fff; opacity: .9; pointer-events: none; }
#cm-machine-wrap.cm-goal-reached #cm-tank { animation: cm-tankglow .8s ease-in-out infinite alternate; }
@keyframes cm-tankglow { from { filter: brightness(1); } to { filter: brightness(1.35) saturate(1.25); } }
#cm-needle { position: absolute; overflow: visible; }
.cm-lamp {
  position: absolute; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%;
  background: radial-gradient(circle, #fff4c2 0%, rgba(255, 196, 96, .9) 22%, rgba(255, 160, 60, .35) 46%, rgba(255, 150, 50, 0) 70%);
  mix-blend-mode: screen; opacity: 0; transition: opacity .3s; pointer-events: none;
}
#cm-machine-wrap.cm-on .cm-lamp { opacity: 1; animation: cm-lamp .6s ease-in-out infinite alternate; }
@keyframes cm-lamp { from { transform: scale(.8); } to { transform: scale(1.12); } }
.cm-tank-pop {
  position: absolute; font-family: 'Gaegu', 'Comic Sans MS', cursive; font-weight: 700; font-size: 52px;
  color: #fff; white-space: nowrap; pointer-events: none;
  text-shadow: 0 3px 0 rgba(40, 60, 90, .45), 0 0 14px var(--water), 0 0 3px rgba(0, 0, 0, .35);
}

/* ---------- cup */
#cm-cup { transform-origin: 50% 50%; will-change: transform, opacity; }
.cm-cup-shadow {
  position: absolute; left: 6%; width: 88%; top: 88%; height: 11%; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(40, 22, 12, .32), rgba(40, 22, 12, 0));
}
#cm-liquid { mix-blend-mode: multiply; }
#cm-cup-shine { background: #fff; opacity: .85; pointer-events: none; }
.cm-steam { position: absolute; left: 28%; width: 44%; top: -4%; height: 42%; pointer-events: none; }
.cm-steam i {
  position: absolute; bottom: 0; width: 36%; height: 72%; border-radius: 50%; opacity: 0;
  background: radial-gradient(closest-side, rgba(255, 255, 255, .8), rgba(255, 255, 255, 0));
  filter: blur(5px);
}
.cm-steam i:nth-child(1) { left: 6%; }
.cm-steam i:nth-child(2) { left: 32%; animation-delay: .85s !important; }
.cm-steam i:nth-child(3) { left: 58%; animation-delay: 1.7s !important; }
#cm-cup.cm-steaming .cm-steam i { animation: cm-steam 2.6s ease-in infinite; }
@keyframes cm-steam {
  0%   { transform: translate(0, 25%) scale(.45, .55); opacity: 0; }
  25%  { opacity: .85; }
  60%  { transform: translate(-14%, -55%) scale(.9, 1.1); opacity: .55; }
  100% { transform: translate(12%, -125%) scale(1.25, 1.45); opacity: 0; }
}

/* ---------- coffee streams */
.cm-stream { width: 9px; margin-left: -4.5px; border-radius: 5px 5px 3px 3px; overflow: hidden; pointer-events: none; }
.cm-stream::after {
  content: ''; position: absolute; inset: 0;
  background: repeating-linear-gradient(180deg, rgba(255, 255, 255, .22) 0 7px, rgba(255, 255, 255, 0) 7px 20px);
  animation: cm-flow .3s linear infinite;
}
@keyframes cm-flow { from { background-position: 0 0; } to { background-position: 0 20px; } }

/* ---------- chalkboard */
.cm-board {
  position: absolute; left: 0; top: 0; width: 500px; height: 700px; transform-origin: 0 0;
  box-sizing: border-box; padding: 16px 22px 14px; overflow: hidden;
  display: flex; flex-direction: column; text-align: center;
  color: var(--chalk); font-family: 'Gaegu', 'Comic Sans MS', cursive;
  text-shadow: 0 0 2px rgba(255, 255, 255, .35), 0 0 1px var(--chalk);
}
.cm-board-title { font-size: 74px; font-weight: 700; line-height: .95; margin-top: 6px; word-break: break-word; }
.cm-board-sub { font-size: 32px; letter-spacing: 4px; opacity: .78; margin: 4px 0 10px; }
.cm-menu { list-style: none; margin: 0; padding: 0 12px; text-align: left; font-size: 46px; }
.cm-menu li { display: flex; align-items: center; gap: 14px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cm-menu li i { flex: none; width: 20px; height: 20px; border-radius: 50%; border: 3px solid var(--chalk); box-shadow: 0 0 2px rgba(255, 255, 255, .4); }
.cm-hint { font-size: 31px; line-height: 1.08; margin-top: 12px; opacity: .88; }
.cm-goal { margin-top: auto; padding: 0 10px; }
.cm-goal-title { font-size: 38px; font-weight: 700; line-height: 1; }
.cm-goal-bar { height: 26px; border: 4px solid var(--chalk); border-radius: 16px; margin: 8px 0 4px; padding: 3px; opacity: .95; }
.cm-goal-bar i {
  display: block; height: 100%; width: 0; border-radius: 10px; transition: width .9s ease;
  background: repeating-linear-gradient(-45deg, var(--chalk) 0 7px, rgba(255, 255, 255, .25) 7px 13px);
}
.cm-goal-value { font-size: 38px; line-height: 1; }
.cm-goal.cm-reached .cm-goal-title { animation: cm-wiggle .5s ease-in-out infinite alternate; }
@keyframes cm-wiggle { from { transform: rotate(-3deg) scale(1); } to { transform: rotate(3deg) scale(1.08); } }

/* ---------- receipt */
#cm-receipt { width: 430px; filter: drop-shadow(0 16px 22px rgba(40, 20, 10, .38)); transform-origin: 50% 0; will-change: transform, opacity; }
.cm-rc-paper {
  position: relative; box-sizing: border-box; padding: 30px 32px 50px;
  background: linear-gradient(180deg, rgba(0, 0, 0, .035), rgba(0, 0, 0, 0) 12%), var(--paper);
  color: var(--ink); font-family: 'Courier Prime', 'Courier New', monospace; font-size: 25px; line-height: 1.3;
  -webkit-mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / 26px 100%;
          mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / 26px 100%;
}
.cm-rc-head { text-align: center; }
.cm-rc-logo { width: 58px; height: 58px; display: block; margin: 0 auto 4px; }
.cm-rc-cafe { font-weight: 700; font-size: 33px; letter-spacing: 1px; text-transform: uppercase; line-height: 1.1; word-break: break-word; }
.cm-rc-meta { display: flex; justify-content: space-between; font-size: 19px; opacity: .72; margin-top: 8px; }
.cm-rc-rule { border-top: 3px dashed currentColor; opacity: .4; margin: 16px 0 14px; }
.cm-rc-for { font-size: 23px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cm-rc-for b { font-size: 28px; }
.cm-rc-line, .cm-rc-total { display: flex; align-items: baseline; gap: 8px; font-weight: 700; margin-top: 12px; }
.cm-rc-dot { flex: none; width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; align-self: center; }
.cm-rc-item { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.cm-rc-line .cm-rc-price { margin-left: auto; padding-left: 10px; align-self: flex-end; }
.cm-rc-dots { flex: 1; min-width: 12px; border-bottom: 3px dotted currentColor; opacity: .45; transform: translateY(-6px); }
.cm-rc-price, #cm-rc-total { white-space: nowrap; }
.cm-rc-total { font-size: 28px; margin-top: 0; }
.cm-rc-msg { font-style: italic; font-size: 21px; margin-top: 12px; opacity: .85; word-break: break-word; }
.cm-rc-thanks { text-align: center; font-weight: 700; font-size: 34px; letter-spacing: 3px; margin: 18px 0 12px; }
.cm-rc-barcode svg { display: block; width: 100%; height: 70px; fill: currentColor; }
.cm-rc-code { text-align: center; font-size: 18px; letter-spacing: 7px; margin-top: 4px; }

/* ---------- goal celebration sparks */
#cm-fx { position: absolute; inset: 0; pointer-events: none; }
.cm-spark { position: absolute; font-size: 38px; line-height: 1; margin: -19px 0 0 -19px; text-shadow: 0 0 10px rgba(255, 255, 255, .8); }

/* ---------- TikTok edition: small connection hint (top-left, closable) */
#bbtt-hint { position: fixed; left: 12px; top: 12px; z-index: 100; display: flex; align-items: center; gap: 9px; max-width: calc(100vw - 24px);
  padding: 7px 8px 7px 13px; border-radius: 999px; background: rgba(28, 18, 30, .84); color: #fff;
  font: 600 14px/1.25 system-ui, 'Segoe UI', sans-serif; box-shadow: 0 4px 16px rgba(0, 0, 0, .35); }
#bbtt-hint i { flex: none; width: 9px; height: 9px; border-radius: 50%; background: #ff5d73; box-shadow: 0 0 0 3px rgba(255, 93, 115, .25); }
#bbtt-hint.ok { background: rgba(18, 104, 70, .9); }
#bbtt-hint.ok i { background: #6dffaf; box-shadow: 0 0 0 3px rgba(109, 255, 175, .25); }
#bbtt-hint button { flex: none; width: 22px; height: 22px; padding: 0; border: 0; border-radius: 50%; background: rgba(255, 255, 255, .16);
  color: #fff; font: 700 15px/22px system-ui, sans-serif; cursor: pointer; }

</style>
</head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<div id="cm-root">
  <div id="cm-stage">
    <div class="cm-shadow" id="cm-shadow-machine"></div>
    <div class="cm-shadow" id="cm-shadow-sign"></div>

    <div id="cm-sign">
      <div class="cm-art">
        <img id="cm-sign-img" alt="">
        <div class="cm-tint" id="cm-sign-tint"></div>
        <div class="cm-light" id="cm-sign-light"></div>
      </div>
      <div class="cm-board" id="cm-board">
        <div class="cm-board-title" id="cm-board-title"></div>
        <div class="cm-board-sub">~ menu ~</div>
        <ul class="cm-menu" id="cm-menu"></ul>
        <div class="cm-hint" id="cm-hint"></div>
        <div class="cm-goal" id="cm-goal">
          <div class="cm-goal-title" id="cm-goal-title"></div>
          <div class="cm-goal-bar"><i id="cm-goal-fill"></i></div>
          <div class="cm-goal-value" id="cm-goal-value"></div>
        </div>
      </div>
    </div>

    <div id="cm-machine-wrap">
      <div id="cm-machine">
        <img id="cm-machine-img" class="cm-full" alt="">
        <div class="cm-tint cm-full" id="cm-machine-tint"></div>
        <div class="cm-light cm-full" id="cm-machine-light"></div>
        <div class="cm-full" id="cm-tank"><canvas id="cm-tank-canvas"></canvas></div>
        <div class="cm-full" id="cm-tank-shine"></div>
        <svg id="cm-needle" width="100" height="100" viewBox="-50 -50 100 100" aria-hidden="true">
          <g id="cm-needle-g" transform="rotate(-118)">
            <polygon points="0,-35 3.6,-3 2.2,12 -2.2,12 -3.6,-3" fill="#5c2b37"/>
            <circle r="7" fill="#9b98a1" stroke="#4d2632" stroke-width="2.4"/>
            <circle cx="-2" cy="-2" r="2" fill="#fff" opacity=".7"/>
          </g>
        </svg>
        <div class="cm-lamp"></div>
        <div class="cm-lamp"></div>
      </div>
    </div>

    <div id="cm-cup" hidden>
      <div class="cm-cup-shadow"></div>
      <div class="cm-art">
        <img id="cm-cup-img" alt="">
        <canvas id="cm-liquid" width="800" height="800"></canvas>
        <div id="cm-cup-shine"></div>
      </div>
      <div class="cm-steam"><i></i><i></i><i></i></div>
    </div>
    <div class="cm-stream" hidden></div>
    <div class="cm-stream" hidden></div>

    <div id="cm-receipt" hidden>
      <div class="cm-rc-paper" id="cm-rc-paper">
        <div class="cm-rc-head">
          <svg class="cm-rc-logo" viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 28h30v10a15 15 0 0 1-15 15h0a15 15 0 0 1-15-15z"/><path d="M44 31h4a6 6 0 0 1 0 12h-5"/><path d="M22 20c0-4 4-4 4-8M31 20c0-4 4-4 4-8"/><path d="M10 58h40"/></g></svg>
          <div class="cm-rc-cafe" id="cm-rc-cafe"></div>
          <div class="cm-rc-meta"><span id="cm-rc-no"></span><span id="cm-rc-time"></span></div>
        </div>
        <div class="cm-rc-rule"></div>
        <div class="cm-rc-for">FOR: <b id="cm-rc-name"></b></div>
        <div class="cm-rc-line"><i class="cm-rc-dot" id="cm-rc-dot"></i><span class="cm-rc-item" id="cm-rc-item"></span><span class="cm-rc-price" id="cm-rc-price"></span></div>
        <div class="cm-rc-msg" id="cm-rc-msg"></div>
        <div class="cm-rc-rule"></div>
        <div class="cm-rc-total"><span>TOTAL</span><span class="cm-rc-dots"></span><span id="cm-rc-total"></span></div>
        <div class="cm-rc-thanks" id="cm-rc-thanks"></div>
        <div class="cm-rc-barcode" id="cm-rc-barcode"></div>
        <div class="cm-rc-code" id="cm-rc-code"></div>
      </div>
    </div>

    <div id="cm-fx"></div>
  </div>
</div>

  // Long café or drink names: shrink the title, then the menu, until the goal still fits on the board.
  function fitBoard() {

  /* ------------------------------------------------------------------ goal */
  function goalTarget() { return Math.max(0.0001, num(F.goalTarget, 100)); }

    return sym + (n % 1 ? n.toFixed(2) : String(n));
  }

    var f = str(F.goalFormat, 'points');

    if (f === 'percent') return Math.floor(v / goalTarget() * 100) + '%';
    return ttFmtNum(v);

    var goalOn = on(F.goalEnabled, true), t = goalTarget(), pct = clamp(state.goal / t, 0, 1);
    var celebrating = Date.now() < celebrateUntil;
    el.goalTitle.textContent = celebrating ? 'GOAL REACHED!' : str(F.goalTitle, 'Water Tank Goal');
    el.goal.classList.toggle('cm-reached', celebrating);
    el.goalFill.style.width = (pct * 100) + '%';
    el.goalValue.textContent = str(F.goalFormat, 'points') === 'percent' ? fmtGoal(state.goal) : fmtGoal(state.goal) + ' / ' + fmtGoal(t);
    tank.target = goalOn ? pct : 0;

  }
  function addGoal(v) {
    if (!on(F.goalEnabled, true) || !(v > 0)) return;

    var before = state.goal;
    state.goal = Math.round((state.goal + v) * 100) / 100;
    save();
    tank.slosh = 1;
    for (var i = 0; i < 9; i++) spawnBubble(true);
    popTank('+' + (str(F.goalFormat, 'points') === 'coins' ? ttCoinText(v) : ttFmtNum(v)));
    if (before < goalTarget() && state.goal >= goalTarget()) celebrate();
    updateGoal();
  }
  function popTank(text) {
    var g = GEO.tank, d = document.createElement('div');
    d.className = 'cm-tank-pop'; d.textContent = text;
    px(d, (g.x0 + g.x1) / 2 + (Math.random() - 0.5) * 60, g.y0 + 40 + Math.random() * 70);
    el.machine.appendChild(d);
    d.animate([
      { transform: 'translate(-50%,-50%) scale(.5)', opacity: 0 },

  }
  function celebrate() {
    celebrateUntil = Date.now() + 7000;
    el.machineWrap.classList.add('cm-goal-reached');
    var g = GEO.tank, cx = lay.machine.x + (g.x0 + g.x1) / 2, cy = lay.machine.y + g.y0 + 30;
    var water = str(F.waterColor, '#7cc8f2');
    for (var i = 0; i < 28; i++) {
      var s = document.createElement('div'), ang = Math.random() * Math.PI * 2, r = 120 + Math.random() * 220;
      s.className = 'cm-spark'; s.textContent = i % 3 ? '✦' : '●';

        { transform: 'translate(' + Math.cos(ang) * r + 'px,' + (Math.sin(ang) * r - 80) + 'px) scale(' + (0.6 + Math.random()) + ') rotate(' + (Math.random() * 360) + 'deg)', opacity: 0 }
      ], { duration: 1300 + Math.random() * 900, easing: 'cubic-bezier(.2,.8,.3,1)', delay: Math.random() * 300 })

  /* ------------------------------------------------------------------ saved goal (TikTok edition)
     Goal progress lives in this browser's localStorage under STORE_KEY. Every access is wrapped: if the browser
     blocks storage the widget keeps going in memory and the start-up hint says progress won't survive a reload.
     The Setup page preview never touches the real save (ttPreview = memory only). */
  var ttMem = null, ttStoreOk = true, ttPreview = false;
  function ttStoreRead() {
    if (ttPreview) return ttMem;
    var raw = null;
    try { raw = localStorage.getItem(STORE_KEY); ttStoreOk = true; }
    catch (e) { ttStoreOk = false; return ttMem; }
    if (!raw) return null;
    try { var o = JSON.parse(raw); return o && typeof o === 'object' ? o : null; } catch (e) { return null; }
  }
  function ttStoreWrite(obj) {
    ttMem = obj;
    if (ttPreview) return;
    try { localStorage.setItem(STORE_KEY, JSON.stringify(obj)); ttStoreOk = true; }
    catch (e) {
      if (ttStoreOk) console.warn('[brew buddy] this browser blocks saving - goal progress is kept in memory only');
      ttStoreOk = false;
    }
  }
  function save() {
    ttStoreWrite({ goal: state.goal, orders: state.orders, token: state.token, t: Date.now() });
  }

  /* ------------------------------------------------------------------ render loop */
  var lastT = 0;
  function loop(ts) {
    var t = ts / 1000, dt = Math.min(0.05, lastT ? t - lastT : 0.016);
    lastT = t;
    tickNeedle(t, dt);
    drawTank(t, dt);
    if (cup.active) { drawLiquid(t); updateStreams(); }
    requestAnimationFrame(loop);
  }

  function tickNeedle(t, dt) {
    var target = needle.brewing ? NEEDLE_BREW + Math.sin(t * 9) * 7 + Math.sin(t * 23) * 3 : NEEDLE_REST;
    needle.vel += ((target - needle.angle) * 40 - needle.vel * 7) * dt;
    needle.angle += needle.vel * dt;
    el.needleG.setAttribute('transform', 'rotate(' + needle.angle.toFixed(2) + ')');
  }

  function tankY(line, x) { return line[0] * x + line[1]; }
  function tankSurface(x, lv) {
    var g = GEO.tank, yb = tankY(g.bot, x) + 4, yt = tankY(g.top, x) + 10;
    return yb + (yt - yb) * lv;
  }
  function spawnBubble(burst) {
    var g = GEO.tank, x = g.x0 + 12 + Math.random() * (g.x1 - g.x0 - 24);
    tank.bubbles.push({ x: x, y: tankY(g.bot, x) - 6 - (burst ? Math.random() * 40 : 0), r: 2 + Math.random() * (burst ? 5 : 3), v: 40 + Math.random() * 60, p: Math.random() * 6 });
  }
  function drawTank(t, dt) {
    var g = GEO.tank, c = el.tctx, ox = g.x0 - 6, oy = g.y0 - 6;
    tank.level += (tank.target - tank.level) * Math.min(1, dt * 1.6);
    tank.slosh = Math.max(0, tank.slosh - dt * 0.55);
    c.clearRect(0, 0, el.tankCanvas.width, el.tankCanvas.height);
    var lv = tank.level;
    if (lv < 0.002) { tank.bubbles.length = 0; return; }

    if (t > tank.nextBubble) { spawnBubble(false); tank.nextBubble = t + 0.5 + Math.random() * 1.2; }

    c.save();
    c.translate(-ox, -oy);
    var amp = (1.2 + tank.slosh * 6) * Math.min(1, lv * 10), pts = [];
    for (var x = g.x0 - 6; x <= g.x1 + 6.01; x += 3) {
      pts.push([x, tankSurface(x, lv) + Math.sin(x * 0.09 + t * 2.4) * amp + Math.sin(x * 0.045 - t * 1.7) * amp * 0.7]);
    }
    var col = hexRgb(str(F.waterColor, '#7cc8f2'));
    var grad = c.createLinearGradient(0, g.y0, 0, g.y1);
    grad.addColorStop(0, rgba(mix(col, [255, 255, 255], 0.25), 0.8));
    grad.addColorStop(1, rgba(mix(col, [10, 40, 90], 0.3), 0.9));
    c.beginPath();
    pts.forEach(function (p, i) { if (i) c.lineTo(p[0], p[1]); else c.moveTo(p[0], p[1]); });
    c.lineTo(g.x1 + 6, g.y1 + 12); c.lineTo(g.x0 - 6, g.y1 + 12); c.closePath();
    c.fillStyle = grad; c.fill();

    c.beginPath();
    pts.forEach(function (p, i) { if (i) c.lineTo(p[0], p[1] + 2); else c.moveTo(p[0], p[1] + 2); });
    c.strokeStyle = 'rgba(255,255,255,.75)'; c.lineWidth = 3; c.stroke();

    c.fillStyle = 'rgba(255,255,255,.35)'; c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 1.5;

    }

  }

  function surfaceAt(f) {

    if (k >= 0 && k < C.spans.length && C.spans[k][1] > C.spans[k][0]) {

    }
    return { cx: cx, yc: yc, rx: rx, ry: rx * C.rim.ry / C.rim.rx };
  }
  function drawLiquid(t) {
    var c = el.lctx, C = GEO.cup, sc = LIQ / C.size[0];
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, LIQ, LIQ);
    if (cup.fill <= 0.003) return;
    c.setTransform(sc, 0, 0, sc, 0, 0);
    var s = surfaceAt(cup.fill);

    var g = c.createLinearGradient(0, s.yc, 0, C.y1);
    g.addColorStop(0, rgba(mix(body, [255, 255, 255], 0.05)));
    g.addColorStop(1, rgba(mix(body, [0, 0, 0], 0.32)));
    c.fillStyle = g;
    c.fillRect(0, s.yc, C.size[0], C.size[1] - s.yc);

    var foam = mix(body, [255, 238, 210], 0.36);
    c.save();
    c.translate(s.cx, s.yc); c.scale(1, s.ry / s.rx);
    var sg = c.createRadialGradient(-s.rx * 0.25, -s.rx * 0.3, s.rx * 0.08, 0, 0, s.rx);
    sg.addColorStop(0, rgba(mix(foam, [255, 255, 255], 0.25)));
    sg.addColorStop(0.72, rgba(foam));
    sg.addColorStop(1, rgba(mix(body, [0, 0, 0], 0.08)));

    if (cup.pour > 0) {
      c.lineWidth = 5;

        var lx = (sp[0] - lay.cup.x) / lay.cup.s - s.cx;
        for (var k = 0; k < 3; k++) {
          var ph = (t * 1.7 + k / 3 + j * 0.17) % 1, r = 8 + ph * Math.min(90, s.rx * 0.35);
          c.beginPath(); c.arc(lx, 0, r, 0, Math.PI * 2);

        }
      });
    }
    c.restore();
  }

  function styleStreams(col) {
    var dark = rgba(mix(col, [0, 0, 0], 0.35)), mid = rgba(col), light = rgba(mix(col, [255, 255, 255], 0.3));
    el.streams.forEach(function (n) { n.style.background = 'linear-gradient(90deg,' + dark + ',' + mid + ' 35%,' + light + ' 50%,' + mid + ' 65%,' + dark + ')'; });
  }
  function updateStreams() {
    var s = surfaceAt(cup.fill), surf = lay.cup.y + s.yc * lay.cup.s;
    el.streams.forEach(function (n, i) {
      var sp = lay.spouts[i], len = surf - sp[1];
      var y0 = sp[1] + len * cup.tail, y1 = sp[1] + len * cup.head;
      if (cup.pour <= 0 || y1 - y0 < 1) { n.hidden = true; return; }
      n.hidden = false;
      px(n, sp[0], y0, null, y1 - y0);
    });
  }

  /* ------------------------------------------------------------------ orders */
  function order(o) {
    if (queue.length >= num(F.maxQueue, 15)) return;
    o.name = str(o.name, '').trim() || 'Someone';
    o.drink = pickDrink(o.pick != null ? o.pick : o.text);
    queue.push(o);
    ttOnQueued(o);
    wake();
    pump();
  }
  function pickDrink(text) {
    var list = drinks();
    if (!list.length) return { i: 0, name: 'Coffee', color: '#5a3a26' };
    var hay = ' ' + norm(text) + ' ';
    for (var i = 0; i < list.length; i++) {
      for (var k = 0; k < list[i].keys.length; k++) {
        if (hay.indexOf(' ' + list[i].keys[k] + ' ') >= 0) return list[i];
      }
    }
    var def = str(F.defaultDrink, 'random');
    for (i = 0; i < list.length; i++) if (String(list[i].i) === def) return list[i];
    return list[Math.floor(Math.random() * list.length)];
  }
  async function pump() {
    if (busy || !ready) return;
    busy = true;
    while (queue.length) {
      var o = queue.shift();
      try { await brew(o); } catch (e) { console.error('[coffee]', e); resetScene(); }
    }
    busy = false;
    armHide();
  }

  function resetScene() {
    anims.forEach(function (a) { try { a.cancel(); } catch (e) {} });
    anims = [];
    cup.active = false; cup.fill = 0; cup.pour = 0; cup.head = cup.tail = 0;
    el.lctx.setTransform(1, 0, 0, 1, 0, 0); el.lctx.clearRect(0, 0, LIQ, LIQ);
    el.streams.forEach(function (n) { n.hidden = true; });
    el.cup.classList.remove('cm-steaming');
    el.cup.hidden = true; el.receipt.hidden = true;
    el.stage.classList.remove('cm-focus');
    el.machine.classList.remove('cm-shaking'); el.machineWrap.classList.remove('cm-on');
    needle.brewing = false;
  }

  async function brew(o) {
    state.orders++; save(); ttOnBrew(o);
    var brewMs = clamp(num(F.brewSeconds, 2.6), 0.5, 20) * 1000;
    var holdMs = clamp(num(F.receiptSeconds, 3.5), 0.5, 60) * 1000;
    ttLayoutFor(o);
    cup.color = hexRgb(o.drink.color); cup.fill = 0; cup.head = cup.tail = 0; cup.pour = 0; cup.active = true;
    styleStreams(cup.color);

    // 0.0s bell, machine wakes up
    play('bell');
    el.machine.classList.add('cm-shaking'); el.machineWrap.classList.add('cm-on'); needle.brewing = true;
    await sleep(200);

    // 0.2s cup slides in along the tray
    el.cup.hidden = false;
    anim(el.cup, [{ transform: 'translateX(230px)', opacity: 0 }, { transform: 'translateX(0px)', opacity: 1 }], { duration: 650, easing: 'cubic-bezier(.2,.8,.3,1)' });
    await sleep(1000);

    // 1.2s double stream, cup fills, steam rises
    play('brew', brewMs + 300);
    cup.pour = 1;
    tween(260, function (k) { cup.head = k; });
    setTimeout(function () { if (cup.active) el.cup.classList.add('cm-steaming'); }, brewMs * 0.35);
    await tween(brewMs, function (k) { cup.fill = 0.84 * k; }, easeInOut);
    await tween(280, function (k) { cup.tail = k; });
    cup.pour = 0;
    el.streams.forEach(function (n) { n.hidden = true; });
    el.machine.classList.remove('cm-shaking'); el.machineWrap.classList.remove('cm-on'); needle.brewing = false;
    await sleep(450);

    // receipt prints, cup comes up close, machine blurs
    fillReceipt(o);
    var focus = on(F.focusMode, true), base = 'translateX(0px)';
    var hero = base;
    if (focus) {
      var cx = lay.cup.x + lay.cup.w / 2, cy = lay.cup.y + lay.cup.w / 2;
      hero = 'translate(' + (lay.hero.cx - cx) + 'px,' + (lay.hero.cy - cy) + 'px) scale(' + (lay.hero.w / lay.cup.w) + ')';
      el.stage.classList.add('cm-focus');
      anim(el.cup, [{ transform: base, opacity: 1 }, { transform: hero, opacity: 1 }], { duration: 750, easing: 'cubic-bezier(.3,.9,.3,1)' });
    }
    el.receipt.hidden = false;
    play('print');
    anim(el.receipt, [
      { transform: 'translateX(560px) rotate(8deg)', opacity: 0 },
      { transform: 'translateX(0px) rotate(-2deg)', opacity: 1 }
    ], { duration: 700, easing: 'cubic-bezier(.2,.9,.3,1.05)' });
    anim(el.rcPaper, [{ clipPath: 'inset(0 0 100% 0)' }, { clipPath: 'inset(0 0 0% 0)' }], { duration: 1300, delay: 150, easing: 'steps(24)' });
    await sleep(holdMs + 700);

    // everything leaves, machine comes back into focus
    el.stage.classList.remove('cm-focus');
    await Promise.all([
      anim(el.receipt, [{ transform: 'translateX(0px) rotate(-2deg)', opacity: 1 }, { transform: 'translateX(520px) rotate(9deg)', opacity: 0 }], { duration: 600, easing: 'ease-in' }),
      anim(el.cup, [{ transform: hero, opacity: 1 }, { transform: hero + ' translateY(40px) scale(.9)', opacity: 0 }], { duration: 600, easing: 'ease-in' })
    ]);
    resetScene();
    await sleep(500);
  }

  function fillReceipt(o) {
    var d = new Date();
    el.rcCafe.textContent = str(F.cafeName, 'Brew Buddy');
    el.rcNo.textContent = 'ORDER #' + ('0000' + state.orders).slice(-4);
    el.rcTime.textContent = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
    el.rcName.textContent = o.name.toUpperCase().slice(0, 24);
    el.rcDot.style.background = o.drink.color;
    el.rcItem.textContent = '1X ' + (o.big ? ttBigLabel() + ' ' : '') + o.drink.name.toUpperCase();
    var price = priceLabel(o);
    el.rcPrice.textContent = price; el.rcTotal.textContent = price;
    var msg = str(o.text, '').trim();
    el.rcMsg.hidden = !(on(F.receiptShowMessage, true) && msg && o.source !== 'chat');
    el.rcMsg.textContent = '"' + (msg.length > 80 ? msg.slice(0, 78) + '…' : msg) + '"';
    el.rcThanks.textContent = str(F.receiptFooter, 'THANK YOU!');

      x += w + (bar ? 0 : 0); bar = !bar;
    }
    for (i = 0; i < 12; i++) digits += Math.floor(rnd() * 10);
    return { svg: '<svg viewBox="0 0 300 60" preserveAspectRatio="none">' + rects + '</svg>', digits: digits };
  }

  /* ------------------------------------------------------------------ audio */
  var AC = null, noiseBuf = null;
  function volume() { return clamp(num(F.volume, 60), 0, 100) / 100; }

  }

    if (url) {
      try {
        var a = new Audio(url); a.volume = volume();
        var p = a.play(); if (p && p.catch) p.catch(function () {});

    if (!ttLastCfg) {                            // first start: load the saved goal
      var s = ttStoreRead();
      if (!s || s.token !== token) { state.goal = num(F.goalStart, 0); state.orders = s ? num(s.orders, 0) : 0; state.token = token; save(); }
      else { state.goal = num(s.goal, 0); state.orders = num(s.orders, 0); state.token = token; }
    } else if (token !== state.token || num(F.goalStart, 0) !== num(prev.goalStart, 0)) {
      state.goal = num(F.goalStart, 0); state.token = token; save();
    }
    updateGoal();
    var reconnect = !ttLastCfg || ttUrlOf(prev) !== ttUrl() || on(prev.connectTikFinity, true) !== on(F.connectTikFinity, true);
    ttLastCfg = F;
    ready = true;
    if (reconnect) { ttTry = 0; ttConnect(); }
    if (!ttHintEl) ttHintBoot(); else ttHintUpdate(false);
    ttTellParent();
    pump();
  }
  function ttUrlOf(f) { var keep = F; F = f; var u = ttUrl(); F = keep; return u; }

  // The Setup page embeds this overlay and talks to it with postMessage: live settings + simulated TikFinity messages.
  window.addEventListener('message', function (ev) {
    if (window.parent === window || ev.source !== window.parent) return;
    var m = ev.data;
    if (!m || typeof m !== 'object') return;
    if (m.type === 'bbtt-config') ttConfigure(m.cfg || {}, true);
    else if (m.type === 'bbtt-sim') ttHandle(m.msg);
    else if (m.type === 'bbtt-resetgoal') { state.goal = num(F.goalStart, 0); save(); updateGoal(); }
  });

  if (window.BB_TT_PREVIEW) {
    ttConfigure({}, true);
    try { window.parent.postMessage({ type: 'bbtt-ready' }, '*'); } catch (e) {}
  } else {
    ttConfigure(ttReadLink(), false);
    window.addEventListener('hashchange', function () { location.reload(); });   // new link pasted into the same page
  }
})();

</script>
