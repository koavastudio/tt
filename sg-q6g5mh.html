  const FX = [{"motion": "fall", "shape": "sprinkle", "colors": ["#ff9fc0", "#9fe0c4", "#ffffff", "#ffd98a"], "n": 55, "size": [3.5, 5.5], "speed": 1.8, "wobble": 14, "spin": true}, {"motion": "fall", "shape": "dot", "colors": ["#ffffff", "#fff6fb"], "n": 60, "size": [1.6, 2.8], "speed": 1.2, "wobble": 16, "glow": 0.7, "glowR": 4, "core": true}];

  function drawRow(row, t, bowH){
