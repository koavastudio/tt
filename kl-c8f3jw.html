[984,352.5],[990,353.0],[996,352.5],[1002,351.0],[1008,350.5],[1014,352.0],[1020,348.5],[1026,334.0],[1032,326.5],[1038,327.5],[1044,327.5],[1050,324.5],[1056,316.5],[1062,320.0],[1068,322.0],[1074,323.5],[1080,333.5],[1086,336.5],[1092,336.5],[1098,333.0],[1104,319.5],[1110,312.0],[1116,314.0],[1122,302.5],[1128,298.0],[1134,298.5],[1140,301.0],[1146,303.0],[1152,296.5],[1158,292.0],[1164,288.0],[1170,294.0],[1176,298.5],[1182,297.0],[1188,288.5],[1194,280.0],[1200,273.0],[1206,270.0],[1212,266.5],[1218,259.0],[1224,262.5],[1230,259.5],[1236,262.0],[1242,263.0],[1248,265.0],[1254,256.5],[1260,248.0],[1266,248.0],[1272,247.5],[1278,245.0],[1284,239.0],[1290,235.0],[1296,233.5],[1302,231.0],[1308,225.5],[1314,209.5],[1320,205.5],[1326,202.5],[1332,202.5],[1338,202.5],[1344,202.0],[1350,192.0],[1356,191.0],[1362,189.0],[1368,186.0],[1374,180.0],[1380,164.0],[1386,150.5],[1392,148.5],[1398,148.0],[1404,148.0],[1410,146.5],[1416,148.0],[1422,147.5],[1428,139.5],[1434,134.0],[1440,130.5],[1446,122.5],[1452,114.5],[1458,110.5],[1464,95.5],[1470,99.5],[1476,89.0],[1482,84.0],[1488,88.5],[1494,93.5],[1500,97.5],[1506,93.0],[1512,76.0],[1518,75.5],[1524,75.0],[1530,74.0]],"thick":188.5,"anchorL":[0,60.5],"anchorR":[1530,74.0]},"red":{"w":1032,"h":1026,"hook":[516.5,2.0],"glow":"#fa6255"},"mint":{"w":979,"h":1080,"hook":[491.0,2.0],"glow":"#bff1a9"},"gold":{"w":968,"h":1032,"hook":[485.5,2.0],"glow":"#fbe36e"},"hat":{"w":1021,"h":1043,"hook":[478.0,3.0],"glow":"#f87c6a"},"pink":{"w":1016,"h":1079,"hook":[508.0,2.0],"glow":"#f9a0af"},"star":{"w":952,"h":1025,"hook":[475.5,2.0],"glow":"#fad24b"},"bow":{"w":1026,"h":796,"hook":[507.68939393939394,2.0],"glow":"#f67069"},"ext":"webp"};
/* Kitty Christmas Lights — hanging garland decoration (no events, pure loop). Engine forked from Twinkle Garland.
   KittyLights.start(cfg, assetBase, geo)
   Top: pine garland swags with glowing cat-head bulbs hanging from them and beaded strings with glowing stars dangling
   at different lengths. Bottom: a thin garland strip with small cat bulbs and tiny stars. Everything sways, glows and
   twinkles on a seamless loop (all motion is a periodic function of time, period `loop`).
   cfg: layout h|v|auto · top/bottom/stars/bows bool · swags/swagsB (0 auto) · width/widthB % · align/alignB left|center|right · stripY % of height · size % · glow % ·
        charms all|red|pastel · amount 0..3 (snow) · speed % · loop s.
   window.__setTime(s) / __draw(s) freeze the clock for frame capture. */
(function(){
const TAU = Math.PI * 2;
const DEF = { layout:'auto', top:true, bottom:true, stars:true, bows:true, swags:0, width:100, align:'center', swagsB:0, widthB:100, alignB:'center', stripY:78, size:100, glow:100,
              charms:'all', amount:1, speed:100, loop:24 };
const DANGLE = ['star'];                       // what hangs on the beaded strings (cycled)
const CLIP = [], CLIP_UP = 0.1;               // charms with a clothespin: clipped straight onto the cord, no thread
const SETS = { all: ['red', 'mint', 'gold', 'hat', 'pink'], red: ['red', 'hat', 'gold'], pastel: ['mint', 'pink', 'gold'] };

function start(userCfg, base, GEO){
  const S = Object.assign({}, DEF);
  for (const k in userCfg) if (userCfg[k] !== undefined && userCfg[k] !== '' && userCfg[k] !== null) S[k] = userCfg[k];
  ['swags','width','swagsB','widthB','stripY','size','glow','amount','speed','loop'].forEach(k => S[k] = +S[k]);
  ['top','bottom','stars','bows'].forEach(k => S[k] = S[k] === true || S[k] === 'true' || S[k] === 1 || S[k] === '1');
  if (!S.loop) S.loop = 24;
  const L = S.loop, spd = (S.speed || 100) / 100, set = SETS[S.charms] || SETS.all;
  const w = n => TAU * n / L;

  let cv = document.getElementById('kl-canvas');
  if (!cv){ cv = document.createElement('canvas'); cv.id = 'kl-canvas'; document.body.appendChild(cv); }
  cv.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none';
  const cx = cv.getContext('2d');
  let W = 0, H = 0, DPR = 1, scene = null, flakes = [];

  const IMG = {}, names = ['swag','red','mint','gold','hat','pink','star','bow'];
  let loaded = 0;
  names.forEach(n => {
    const im = new Image();
    im.crossOrigin = 'anonymous';
    im.onload = im.onerror = () => { if (++loaded === names.length) { build(); requestAnimationFrame(frame); } };
    im.src = base + n + '.' + (GEO.ext || 'png');
    IMG[n] = im;
  });
  const ok = n => IMG[n] && IMG[n].naturalWidth > 0;
  let seed = 29;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const m0 = () => Math.min(W, H) / 1080;
  function hexA(h, a){ const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }

  function build(){
    seed = 29;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    const vertical = S.layout === 'v' || (S.layout === 'auto' && H > W);
    const k = S.size / 100, sw = GEO.swag;
    // ---- top garland: swags across the full width, charms on each swag, star strings between them
    // width % + position: the garland can cover part of the screen; auto repeat keeps the swag size when it's narrower
    const TW = W * Math.max(10, Math.min(100, S.width || 100)) / 100, LX = S.align === 'left' ? 0 : S.align === 'right' ? W - TW : (W - TW) / 2;
    const nSw = S.swags > 0 ? Math.round(S.swags) : Math.max(1, Math.round((vertical ? 2 : 3) * TW / W)), span = TW / nSw;
    const sk = span / (sw.anchorR[0] - sw.anchorL[0]), topY = -sw.anchorL[1] * sk + 8 * m0();
    const charmH = Math.min(span * 0.26, H * (vertical ? 0.075 : 0.13)) * k, items = [], swags = [];
    let ci = 0;
    for (let i = 0; i < nSw; i++){
      const x0 = LX + i * span;
      swags.push({ x: x0 - sw.anchorL[0] * sk, y: topY, k: sk, px: x0 + span / 2, ph: i * 1.7, n: 2 + (i % 2) });
      const at = u => { const pts = sw.line, p = pts[Math.round(u * (pts.length - 1))]; return [x0 - sw.anchorL[0] * sk + p[0] * sk, topY + p[1] * sk + sw.thick * sk * 0.3]; };
      for (const u of [0.22, 0.5, 0.78]){
        const [ax, ay] = at(u);
        items.push({ kind: 'charm', key: set[ci++ % set.length], ax, ay, len: charmH * (0.15 + 0.35 * rnd()), h: charmH * (0.92 + rnd() * 0.16), ph: rnd() * TAU, n: 1 + (ci % 3), sw: i });
      }
      if (S.stars) for (const u of [0.1, 0.36, 0.64, 0.9]){
        const [ax, ay] = at(u);
        items.push({ kind: 'star', key: DANGLE[items.length % DANGLE.length], ax, ay, len: charmH * (1.25 + rnd() * 1.3), /* always below the bulbs */ h: charmH * (0.42 + rnd() * 0.22), ph: rnd() * TAU, n: 1 + Math.floor(rnd() * 3), sw: i });
      }
    }
    // ---- bottom strip: the SAME pine garland, smaller and with more swags (a thin echo of the top one)
    // 9:16: the strip sits mid-screen by default, above TikTok's comment area
    const stripPct = vertical && S.stripY === DEF.stripY ? 46 : S.stripY;
    const BW = W * Math.max(10, Math.min(100, S.widthB || 100)) / 100, LB = S.alignB === 'left' ? 0 : S.alignB === 'right' ? W - BW : (W - BW) / 2;
    const nB = S.swagsB > 0 ? Math.round(S.swagsB) : Math.max(1, Math.round((vertical ? 4 : 7) * BW / W)), spanB = BW / nB, kB = spanB / (sw.anchorR[0] - sw.anchorL[0]);
    const yB = H * stripPct / 100 - sw.anchorL[1] * kB, cB = Math.min(charmH * 0.5, spanB * 0.26 * k), swagsB = [], itemsB = [];
    for (let i = 0; i < nB; i++){
      const x0 = LB + i * spanB;
      swagsB.push({ x: x0 - sw.anchorL[0] * kB, y: yB, k: kB, px: x0 + spanB / 2, ph: i * 1.3, n: 2 + (i % 2) });
      const at = u => { const pts = sw.line, p = pts[Math.round(u * (pts.length - 1))]; return [x0 - sw.anchorL[0] * kB + p[0] * kB, yB + p[1] * kB + sw.thick * kB * 0.3]; };
      const [cxp, cyp] = at(0.5);
      itemsB.push({ kind: 'charm', key: set[i % set.length], ax: cxp, ay: cyp, len: cB * 0.12, h: cB, ph: rnd() * TAU, n: 2 + (i % 3), sw: i });
      if (S.stars) for (const u of [0.2, 0.8]){
        const [ax, ay] = at(u);
        itemsB.push({ kind: 'star', key: DANGLE[itemsB.length % DANGLE.length], ax, ay, len: cB * (0.5 + rnd() * 0.9), h: cB * 0.45, ph: rnd() * TAU, n: 1 + Math.floor(rnd() * 3), sw: i });
      }
    }
    scene = { vertical, rows: [{ swags, items, bow: 0.55, ends: TW < W - 1 }, { swags: swagsB, items: itemsB, bow: 0.5, ends: BW < W - 1 }], charmH };
    for (const r of scene.rows) for (const it of r.items) if (it.kind === 'charm' && CLIP.includes(it.key)) it.len = -it.h * CLIP_UP;
    initSnow();
  }

  // ---------- snow + fairy dots ----------
  function initSnow(){
    const n = Math.round([0, 50, 120, 220][Math.max(0, Math.min(3, S.amount | 0))] * (W * H) / (1920 * 1080));
    flakes = [];
    for (let i = 0; i < n; i++){
      const z = rnd();
      flakes.push({ x0: rnd() * W, off: rnd(), m: z > 0.7 ? 2 : 1, r: (1.2 + z * 2.8) * m0(), a: 0.4 + z * 0.5, wn: 1 + Math.floor(rnd() * 3), wp: rnd() * TAU, wd: 8 + rnd() * 18 });
    }
  }
  function drawSnow(t){
    cx.fillStyle = '#fff';
    for (const f of flakes){
      const y = ((t / L) * f.m + f.off) % 1 * (H + 20) - 10, x = f.x0 + Math.sin(w(f.wn) * t + f.wp) * f.wd;
      cx.globalAlpha = f.a; cx.beginPath(); cx.arc(x, y, f.r, 0, TAU); cx.fill();
    }
    cx.globalAlpha = 1;
  }
  function glowAt(x, y, r, col, a){
    if (a <= 0) return;
    cx.save(); cx.globalCompositeOperation = 'lighter';
    const g = cx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, hexA(col, 0.55 * a)); g.addColorStop(0.45, hexA(col, 0.22 * a)); g.addColorStop(1, hexA(col, 0));
    cx.fillStyle = g; cx.fillRect(x - r, y - r, r * 2, r * 2); cx.restore();
  }

  // ---------- one hanging item: string + charm/star, pendulum sway + glow pulse ----------
  function drawItem(it, t, swing){
    const key = it.kind === 'star' ? (it.key || 'star') : it.key, g = GEO[key];
    if (!ok(key)) return;
    const ang = Math.sin(w(it.n) * t + it.ph) * (it.kind === 'star' ? 0.09 : 0.055) + (swing || 0);
    const hh = it.h, ww = hh * g.w / g.h;
    cx.save(); cx.translate(it.ax, it.ay); cx.rotate(ang);
    // string: beads for stars, a thin wire for bulbs
    if (it.kind === 'star'){
      const n = Math.max(2, Math.round(it.len / (9 * m0())));
      for (let i = 1; i <= n; i++){
        const y = it.len * i / n;
        glowAt(0, y, 7 * m0(), '#ffe6a0', 0.6);
        cx.fillStyle = '#fff1c6'; cx.beginPath(); cx.arc(0, y, 2.2 * m0(), 0, TAU); cx.fill();
      }
    } else if (it.len > 0){
      cx.strokeStyle = '#4a2c1c'; cx.lineWidth = 2.5 * m0(); cx.beginPath(); cx.moveTo(0, 0); cx.lineTo(0, it.len); cx.stroke();
    }
    const pulse = 0.75 + 0.25 * Math.sin(w(it.n + 2) * t + it.ph * 2);
    const cy2 = it.len + hh * 0.5;
    glowAt(0, cy2, hh * (it.kind === 'star' ? 1.3 : 1.15), g.glow, (S.glow / 100) * pulse);
    cx.drawImage(IMG[key], -g.hook[0] / g.w * ww, it.len - g.hook[1] / g.h * hh, ww, hh);
    // twinkle: a 4-point sparkle that flashes on stars now and then
    if (it.kind === 'star'){
      const c = (t / L) * 3 + it.ph, p = c - Math.floor(c), a = p < 0.25 ? Math.sin(p / 0.25 * Math.PI) : 0;
      if (a > 0.02){
        cx.save(); cx.globalCompositeOperation = 'lighter'; cx.globalAlpha = a; cx.fillStyle = '#fffbe8';
        cx.translate(ww * 0.25, cy2 - hh * 0.3); cx.beginPath();
        const r = hh * 0.5;
        for (let i = 0; i < 4; i++){ const an = i * TAU / 4; cx.lineTo(Math.cos(an) * r, Math.sin(an) * r); cx.lineTo(Math.cos(an + TAU / 8) * r * 0.18, Math.sin(an + TAU / 8) * r * 0.18); }
        cx.closePath(); cx.fill(); cx.restore();
      }
    }
    cx.restore();
  }

  function drawRow(row, t, bowH){
    const sw = GEO.swag;
    // strings and charms hang BEHIND the garland greenery, so draw them first
    for (const it of row.items){
      const s = row.swags[it.sw], a = Math.sin(w(s.n) * t + s.ph) * 0.01;
      cx.save(); cx.translate(s.px, s.y + sw.anchorL[1] * s.k); cx.rotate(a); cx.translate(-s.px, -(s.y + sw.anchorL[1] * s.k));
      drawItem(it, t, 0); cx.restore();
    }
    for (const s of row.swags){
      const a = Math.sin(w(s.n) * t + s.ph) * 0.01, ay = s.y + sw.anchorL[1] * s.k, sz = s.k / row.swags[0].k;
      cx.save(); cx.translate(s.px, ay); cx.rotate(a); cx.translate(-s.px, -ay);
      cx.drawImage(IMG.swag, s.x, s.y, sw.w * s.k, sw.h * s.k);
      // fairy lights twinkling along the swag line (fewer and smaller on a small swag)
      const pts = sw.line, nl = Math.max(8, Math.round(18 * Math.min(1, s.k / 0.4)));
      for (let i = 0; i < nl; i++){
        const p = pts[Math.round((i + 0.5) / nl * (pts.length - 1))], x = s.x + p[0] * s.k, y = s.y + (p[1] - sw.thick * 0.18) * s.k;
        const on = 0.5 + 0.5 * Math.sin(w(3 + (i % 3)) * t + i * 1.3), r = Math.max(1.6, 2.6 * m0() * Math.min(1, s.k * 2.2));
        glowAt(x, y, r * 5.5, '#ffe2a0', on * 0.9 * S.glow / 100);
        cx.fillStyle = `rgba(255,248,225,${0.5 + 0.5 * on})`; cx.beginPath(); cx.arc(x, y, r, 0, TAU); cx.fill();
      }
      cx.restore();
    }
    // bows where swags meet; a garland narrower than the screen also gets one at each free end
    const ties = row.swags.map(s => [s.x + sw.anchorL[0] * s.k, s.y + sw.anchorL[1] * s.k]);
    if (row.ends){ const e = row.swags[row.swags.length - 1]; ties.push([e.x + sw.anchorR[0] * e.k, e.y + sw.anchorR[1] * e.k]); }
    if (S.bows && ok('bow')) for (let i = row.ends ? 0 : 1; i < ties.length; i++){
      const g = GEO.bow, bh = bowH, bw = bh * g.w / g.h, x = ties[i][0], y = ties[i][1];
      cx.save(); cx.translate(x, y); cx.rotate(Math.sin(w(3) * t + i) * 0.04); cx.drawImage(IMG.bow, -bw / 2, -bh * 0.4, bw, bh); cx.restore();
    }
  }

  let frozen = null;
  window.__setTime = s => { frozen = s; };
  window.__ready = () => loaded === names.length && !!scene;
  window.__draw = s => draw(s);
  function frame(now){ draw(frozen !== null ? frozen : now / 1000); requestAnimationFrame(frame); }
  function draw(abs){
    const t = ((abs * spd) % L + L) % L;
    cx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cx.clearRect(0, 0, W, H);
    if (S.amount > 0) drawSnow(t);
    if (!ok('swag')) return;
    if (S.bottom) drawRow(scene.rows[1], t, scene.charmH * 0.32);
    if (S.top) drawRow(scene.rows[0], t, scene.charmH * 0.55);
  }
  window.addEventListener('resize', () => { if (loaded === names.length) build(); });
}
window.KittyLights = { start, DEF };
})();

(function(){
  var Q = new URLSearchParams(location.search), cfg = {};
  Q.forEach(function(v, k){ cfg[k] = v === 'true' ? true : v === 'false' ? false : v; });
  if (Q.get('bg')) document.body.style.background = '#' + Q.get('bg').replace('#', '');
  KittyLights.start(cfg, 'kl-c8f3jw/', window.KL_GEO);
})();
